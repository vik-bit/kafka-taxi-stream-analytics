name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sketches:
    name: Sketch self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile every module
        run: python -m compileall -q common producer stage1_clean_bloom stage2_stream_analytics stage3_lsh final_consumer scripts
      # Bloom, DGIM, HyperLogLog, reservoir and MinHash-LSH against exact answers, offline (no Kafka).
      - name: Self-tests
        run: python -m common.selftest
